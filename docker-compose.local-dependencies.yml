# Local dependencies for development: LocalStack emulating DynamoDB.
# Started by launch (scripts/launch.ps1) through WSL (Docker runs inside WSL, not on Windows).
#
# Pinned to 4.9: newer LocalStack images require an auth token.

name: toaletka-local

services:
  localstack:
    image: localstack/localstack:4.9
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      AWS_DEFAULT_REGION: eu-central-1
    volumes:
      - ./scripts/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Healthy only after the init script has created and seeded the table.
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 3s
      timeout: 3s
      retries: 40
