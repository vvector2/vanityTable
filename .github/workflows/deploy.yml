# The one deploy logic, called by deploy-dev.yml and deploy-manual.yml.
# plan: builds and pushes the images and writes the Terraform plan.
# apply: waits for approval on the GitHub environment, then applies that exact plan
# and deploys the UI. The halves are scripts/ci/plan.sh and apply.sh and use the same AWS role.
# Setup (role, environments): infra/README.md, section CI/CD.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        type: string
        required: true
      ref:
        description: Branch, tag or SHA to deploy. Empty deploys the commit that triggered the run.
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  # The apply must run the Terraform version that wrote the plan.
  TERRAFORM_VERSION: 1.16.6
  AWS_REGION: eu-central-1

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      role: ${{ steps.source.outputs.role }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The role github-actions-<env> lives in the account named in the environment's tfvars.
      - id: source
        name: Resolve commit, account and role
        run: ./scripts/ci/resolve-role.sh "${{ inputs.environment }}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # The wrapper adds output around `terraform output -raw`, which the scripts read.
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.source.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}

      # Also creates the ECR repositories on an environment's first run, and writes the run summary.
      - name: Build images and plan
        run: ./scripts/ci/plan.sh "${{ inputs.environment }}"

      # The plan holds values from the state, secrets included; keep it briefly.
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/tfplan
          retention-days: 1

  apply:
    name: Apply (${{ inputs.environment }})
    needs: plan
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the job wait for approval.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ needs.plan.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra

      - name: Apply and deploy the UI
        run: ./scripts/ci/apply.sh "${{ inputs.environment }}"
